[build]
  # Netlify runs this from the repo root (package path apps/web), where the lockfile and workspace live.
  command = "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @alpix/web... build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"
  PNPM_VERSION = "10"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
