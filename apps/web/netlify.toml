[build]
  # Site package directory is apps/web; lockfile and workspace live at the repo root.
  command = "cd ../.. && corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @alpix/web build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"
  PNPM_VERSION = "10"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
